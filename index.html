<html>
<head>
  <style>
    body {
      background-color: #f0f0ff; /* رنگ پس‌زمینه‌ی صفحه */
      font-family: Tahoma;       /* نوع فونت کل صفحه */
    }

    .card {
      background-color: white;   /* رنگ جعبه */
      width: 300px;              /* عرض جعبه */
      padding: 20px;             /* فاصله‌ی داخل جعبه */
      margin: 100px auto;        /* وسط‌چین کردن جعبه */
      border-radius: 15px;       /* گرد کردن گوشه‌ها */
      box-shadow: 0 0 10px gray; /* سایه برای زیباتر شدن */
      text-align: center;        /* وسط‌چین کردن متن */
    }

    h1 {
      color: purple;
      font-size: 28px;
    }

    p {
      color: darkblue;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>سلام اسکندر! 👋</h1>
    <p>به دنیای CSS خوش اومدی 💜</p>
  </div>
</body>
</html>
